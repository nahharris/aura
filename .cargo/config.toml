[alias]
xtask = "run -p xtask --"
ci = "xtask dev ci"
fmt-check = "xtask dev fmt-check"
qa = "xtask dev qa"
lint = "xtask dev lint"
test-all = "xtask dev test"
check-all = "xtask dev check"
build-all = "xtask dev build"
fmt-all = "xtask dev fmt"
docs-sync = "xtask docs sync"
docs-check = "xtask docs check"
check-llvm = "xtask llvm check"
build-llvm = "xtask llvm build"
test-llvm = "xtask llvm test"
clippy-llvm = "xtask llvm clippy"
