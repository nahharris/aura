[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
xshell = "0.2"
tar = "0.4"
xz2 = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
time = { version = "0.3", features = ["formatting", "macros"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
